<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Detector de Somnolencia{% endblock %}</title>
  <meta name="description" content="Sistema de detección de somnolencia para conductores usando IA — MediaPipe FaceLandmarker">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-900: #0a0b14;
      --bg-800: #111322;
      --bg-700: #181b2e;
      --bg-600: #1e2240;
      --glass:  rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --cyan:   #00d4ff;
      --green:  #00e87a;
      --yellow: #ffc94d;
      --red:    #ff4757;
      --purple: #7c5cbf;
      --text:   #e8eaf6;
      --muted:  #6b7280;
      --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-900);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,212,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(124,92,191,0.06) 0%, transparent 50%);
    }

    /* ── Scrollbar ───────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-800); }
    ::-webkit-scrollbar-thumb { background: var(--bg-600); border-radius: 3px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
